[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
senbonzakura-ast = { path = "crates/ast" }
senbonzakura-check = { path = "crates/check" }
senbonzakura-interpret = { path = "crates/interpret" }
senbonzakura-lexer = { path = "crates/lexer" }
senbonzakura-parser = { path = "crates/parser" }

nu-ansi-term = "0.50"
reedline = "0.53.0"
unicode-general-category = "1.1.0"
