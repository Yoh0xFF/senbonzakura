version: '3'

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  build:
    desc: Build the release binary
    cmds:
      - cargo build --release

  clean:
    desc: Clean all build artifacts
    cmds:
      - cargo clean

  test:
    desc: Run all tests
    cmds:
      - cargo test

  fmt:
    desc: Format all Rust files
    cmds:
      - cargo fmt

  lint:
    desc: Run clippy on the library, binary and tests
    cmds:
      - cargo clippy --all-targets -- -D warnings

  check:
    desc: Lint and test
    cmds:
      - task: lint
      - task: test

  repl:
    desc: Start the interactive prompt
    interactive: true
    cmds:
      - cargo run --quiet -- --repl

  run:
    desc: 'Check a file and report its problems, or run it: task run -- --run hello.sz'
    cmds:
      - cargo run --quiet -- {{.CLI_ARGS}}

  hooks:
    desc: Install the pre-commit hook from .githooks
    cmds:
      - git config core.hooksPath .githooks
